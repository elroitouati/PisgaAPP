<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Two values so the browser chrome matches before the theme script runs;
         ThemeProvider narrows this to the resolved theme afterwards. -->
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e10" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="PISGA — אפליקציית שיפור עצמי ומוטיבציה יומיומית" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PISGA" />
    <title>PISGA</title>

    <!-- Social link preview (WhatsApp, iMessage, Slack, Twitter/X...). There
         was no og:* here at all before — an invite link pasted anywhere
         showed no preview card, just a bare URL. This is one static card for
         every route (this is a client-side SPA — every path serves this same
         index.html), not a personalized "so-and-so invited you" preview:
         that needs server-side rendering per /join/:token, which needs a
         hosting decision that hasn't been made yet. og:image uses a
         root-relative path so it resolves correctly on whichever domain this
         ends up deployed to. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PISGA" />
    <meta property="og:title" content="PISGA — מטרה קטנה כל יום" />
    <meta property="og:description" content="הצטרפו אליי למטרה משותפת ב-PISGA — שינוי גדול נבנה מהצעדים הקטנים." />
    <meta property="og:image" content="/brand/og-share.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PISGA — מטרה קטנה כל יום" />
    <meta name="twitter:description" content="הצטרפו אליי למטרה משותפת ב-PISGA — שינוי גדול נבנה מהצעדים הקטנים." />
    <meta name="twitter:image" content="/brand/og-share.png" />
    <script>
      // Applied before first paint so the app never flashes the wrong theme/direction.
      (function () {
        try {
          var theme = localStorage.getItem('pisga.theme');
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;

          var lang = localStorage.getItem('pisga.lang') || 'he';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
        } catch (e) {
          /* private mode / storage blocked — fall back to the markup defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
