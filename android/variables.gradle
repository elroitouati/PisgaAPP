ext {
    // 26, not Capacitor's default 24: androidx.health.connect:connect-client
    // declares minSdk 26 and the manifest merger refuses anything lower. The
    // documented escape hatch (tools:overrideLibrary) only moves the failure
    // to runtime on the devices it lets in, which for a health read is worse
    // than not installing. API 26 is Android 8.0 (2017).
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}